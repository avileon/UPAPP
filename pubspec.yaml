name: up
description: >-
  UP — Bluetooth-first proximity discovery. The app talks to a real backend;
  BLE itself is still to come, and a shared venue code stands in for it.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

# Four dependencies, all of them maintained by the Dart or Flutter team, and
# each one here because there is no alternative inside the SDK:
#
#   http                — `dart:io` does not exist in a browser, so a single
#                         import of it makes `flutter build web` fail. This is
#                         the one client that works on a phone and on the web.
#   shared_preferences  — likewise for storage: app preferences on Android,
#                         localStorage in a browser.
#   image_picker        — nothing in the SDK can open the system photo picker,
#                         and a dating app without photographs is not testable.
#                         Gallery only, no camera, which is why the app asks for
#                         no permissions on Android 13 and later.
#   qr_flutter          — draws the venue QR. Pure Dart, no platform code.
#   web                 — typed bindings for the browser APIs the SDK does not
#                         wrap: service workers and the Push API. Maintained by
#                         the Dart team, no transitive dependencies, and
#                         imported from exactly one file that never reaches an
#                         Android build.
#
# Everything else still ships inside the SDK. That was never a purity rule; it
# is why `flutter pub get` resolves in seconds and why there is almost no
# supply chain to audit.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
