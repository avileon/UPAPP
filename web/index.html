<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <!-- Replaced by `flutter build web --base-href`. Must start and end with "/". -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="UP — אפליקציית היכרויות למי שנמצא כאן ועכשיו">
  <meta name="theme-color" content="#0d0a14">
  <meta name="color-scheme" content="dark">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="UP">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>UP</title>
  <link rel="manifest" href="manifest.json">

  <!--
    The app is ~1 MB of compressed JavaScript plus the rendering engine. Asking
    for it here, before the bootstrap script has even run, starts the biggest
    download at the earliest possible moment instead of one round trip later.
  -->
  <link rel="preload" href="main.dart.js" as="script">

  <!--
    Everything below is the loading screen. It exists because until Flutter
    paints its first frame the page is otherwise an empty white document, and
    on a phone on mobile data that lasts long enough for people to think the
    site is broken and leave. It is plain CSS so it shows on the first paint.
  -->
  <style>
    html, body { margin: 0; height: 100%; background: #0d0a14; color: #f6f0fc; }
    #up-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      background: radial-gradient(60% 45% at 50% 42%, #2a1230 0%, #0d0a14 70%);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      transition: opacity .25s ease;
    }
    #up-splash.gone { opacity: 0; pointer-events: none; }
    #up-splash .logo {
      font-weight: 900; font-size: 64px; letter-spacing: -1px; color: #ff3d8b;
      text-shadow: 0 0 28px #ff3d8b88; animation: up-pulse 1.6s ease-in-out infinite;
    }
    #up-splash .bar { width: 140px; height: 4px; border-radius: 4px; background: #2c2339; overflow: hidden; }
    #up-splash .bar i {
      display: block; width: 40%; height: 100%; border-radius: 4px; background: #3dffc5;
      box-shadow: 0 0 12px #3dffc5; animation: up-slide 1.1s ease-in-out infinite;
    }
    #up-splash .msg { font-size: 15px; color: #ad9fc2; min-height: 1.4em; text-align: center; padding: 0 24px; }
    #up-splash button {
      display: none; border: 0; border-radius: 999px; padding: 12px 26px;
      background: #ff3d8b; color: #fff; font: inherit; font-weight: 700; font-size: 16px; cursor: pointer;
    }
    #up-splash.slow button { display: inline-block; }
    @keyframes up-pulse { 50% { transform: scale(1.06); } }
    @keyframes up-slide { 0% { transform: translateX(260%); } 100% { transform: translateX(-160%); } }
    @media (prefers-reduced-motion: reduce) {
      #up-splash .logo, #up-splash .bar i { animation: none; }
    }
    #up-install {
      position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom));
      z-index: 9998; display: none; gap: 12px; align-items: center;
      background: #1c1526; border: 1px solid #ff3d8b; border-radius: 18px; padding: 14px 16px;
      box-shadow: 0 10px 40px #000a, 0 0 24px #ff3d8b44; color: #f6f0fc;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    #up-install.show { display: flex; }
    #up-install .ic { flex: none; width: 44px; height: 44px; border-radius: 12px; background: #ff3d8b;
      color: #fff; font-weight: 900; font-size: 18px; display: flex; align-items: center; justify-content: center; }
    #up-install .tx { flex: 1; min-width: 0; }
    #up-install b { display: block; font-size: 15px; margin-bottom: 2px; }
    #up-install span { font-size: 13px; color: #ad9fc2; }
    #up-install .act { display: flex; flex-direction: column; gap: 6px; }
    #up-install button { border: 0; border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 14px;
      font-weight: 700; cursor: pointer; }
    #up-install .yes { background: #ff3d8b; color: #fff; }
    #up-install .no { background: transparent; color: #ad9fc2; }
  </style>
</head>
<body>
  <div id="up-splash" role="status" aria-live="polite">
    <div class="logo" aria-hidden="true">UP</div>
    <div class="bar" aria-hidden="true"><i></i></div>
    <div class="msg" id="up-splash-msg">טוען…</div>
    <button type="button" onclick="location.reload()">נסו שוב</button>
  </div>
  <noscript><p style="text-align:center;padding:40px">כדי להשתמש ב-UP צריך להפעיל JavaScript בדפדפן.</p></noscript>

  <script>
    // Honest progress text, so a slow connection reads as "slow" rather than
    // "broken", and a way out if it really is stuck (a dropped connection, a
    // filtered network, an in-app browser that killed the download).
    (function () {
      var el = document.getElementById('up-splash');
      var msg = document.getElementById('up-splash-msg');
      var steps = [
        [4000, 'עוד רגע… החיבור קצת איטי'],
        [12000, 'זה לוקח יותר מהרגיל'],
      ];
      steps.forEach(function (s) {
        setTimeout(function () { if (!el.classList.contains('gone')) msg.textContent = s[1]; }, s[0]);
      });
      setTimeout(function () {
        if (el.classList.contains('gone')) return;
        el.classList.add('slow');
        msg.textContent = 'הטעינה נתקעה. בדקו את החיבור ונסו שוב.';
      }, 25000);
      window.__upSplashDone = function () {
        el.classList.add('gone');
        setTimeout(function () { el.remove(); }, 300);
      };
      window.__upSplashFail = function () {
        el.classList.add('slow');
        msg.textContent = 'משהו השתבש בטעינה. נסו שוב.';
      };
    })();
  </script>
  <!--
    "Install UP on your phone": a home-screen icon, full screen, notifications.
    Android/Chrome gets the real install prompt; iPhone gets the two taps it
    needs in Safari. Never inside the installed app, and "later" means a few
    days of quiet.
  -->
  <div id="up-install" role="dialog" aria-labelledby="up-install-t">
    <div class="ic" aria-hidden="true">UP</div>
    <div class="tx">
      <b id="up-install-t">להתקין את UP בטלפון?</b>
      <span id="up-install-b">אייקון במסך הבית, מסך מלא והתראות — בלי חנות אפליקציות.</span>
    </div>
    <div class="act">
      <button type="button" class="yes" id="up-install-yes">להתקין</button>
      <button type="button" class="no" id="up-install-no">אחר כך</button>
    </div>
  </div>
  <script>
    (function () {
      var KEY = 'up-install-later';
      var box = document.getElementById('up-install');
      var yes = document.getElementById('up-install-yes');
      var no = document.getElementById('up-install-no');
      var body = document.getElementById('up-install-b');
      var deferred = null;
      var standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
      var ua = navigator.userAgent || '';
      var ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var mobile = ios || /Android/i.test(ua);
      function snoozed() {
        try { return Date.now() < Number(localStorage.getItem(KEY) || 0); } catch (e) { return false; }
      }
      function snooze() {
        try { localStorage.setItem(KEY, String(Date.now() + 3 * 24 * 3600 * 1000)); } catch (e) {}
      }
      function show() {
        if (standalone || !mobile || snoozed()) return;
        if (!ios && !deferred) return;
        if (ios) {
          body.textContent = 'בספארי: לוחצים על כפתור השיתוף ⬆ ואז "הוסף למסך הבית".';
          yes.textContent = 'הבנתי';
        }
        box.classList.add('show');
      }
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferred = e;
      });
      window.addEventListener('appinstalled', function () { box.classList.remove('show'); snooze(); });
      yes.addEventListener('click', function () {
        box.classList.remove('show');
        if (deferred) {
          deferred.prompt();
          deferred.userChoice.finally(function () { deferred = null; });
        } else {
          snooze();
        }
      });
      no.addEventListener('click', function () { box.classList.remove('show'); snooze(); });
      // A few seconds after the app is up, not over the loading screen.
      setTimeout(show, 6000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
