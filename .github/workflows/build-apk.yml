name: Build APK

# Builds an installable Android APK on GitHub's machines, so nothing has to be
# installed locally. Runs on every push and can be started by hand from the
# Actions tab.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Show Flutter version
        run: flutter --version

      # The android/ folder is not committed — Flutter regenerates it.
      - name: Generate platform folders
        run: flutter create --org co.vibit.up --project-name up --platforms=android .

      - name: Fetch dependencies
        run: flutter pub get

      # Reported but not fatal: a lint note should never block a test build.
      # A real compile error still fails the build step below.
      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Test
        run: flutter test
        continue-on-error: true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: up-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
