name: Build APK

# Builds the Android APKs on GitHub's machines and publishes them — together
# with the analyze and test logs — as the "latest" release, so both the app and
# its diagnostics are reachable from a plain URL.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter --version

      # The android/ folder is not committed — Flutter regenerates it.
      - run: flutter create --org co.vibit.up --project-name up --platforms=android .

      # `flutter create` also drops in a template test that references a MyApp
      # class this project does not have. It is not our test; remove it.
      - run: rm -f test/widget_test.dart

      - run: flutter pub get

      # Captured rather than streamed: the logs ship as release assets so the
      # full output can be read from a URL instead of the Actions UI.
      - run: flutter analyze > analyze-output.txt 2>&1 || true
      - run: flutter test --reporter expanded > test-output.txt 2>&1 || true

      # One fat APK for any device, plus a per-architecture set. The arm64 one
      # is a third of the size and is what every phone from the last few years
      # actually needs.
      - run: flutter build apk --release
      - run: flutter build apk --release --split-per-abi

      - name: Record how each APK is signed
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | tail -1)
          ls -la build/app/outputs/flutter-apk/ > signing.txt 2>&1
          for f in build/app/outputs/flutter-apk/*.apk; do
            echo "=== $f" >> signing.txt
            "${BT}apksigner" verify --verbose --print-certs "$f" >> signing.txt 2>&1 \
              || echo "NOT SIGNED / verification failed" >> signing.txt
          done

      - uses: actions/upload-artifact@v4
        with:
          name: up-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      # A build artifact always downloads as a .zip and needs a login. A release
      # asset is the raw file, so a phone can install it straight from Chrome.
      #
      # `always()`, because the run this matters most for is the one that
      # failed: a broken build leaves no APK but it does leave the analyzer and
      # test output, and that output is unreadable from anywhere except this
      # page unless something publishes it.
      - name: Publish the APKs and the logs as a release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # nullglob so a pattern that matches nothing disappears instead of
          # being passed through literally. Explicit `if`s rather than
          # `[ -f x ] && ...`, which under `set -e` can end the step.
          shopt -s nullglob
          APKS=(build/app/outputs/flutter-apk/*.apk)
          FILES=()
          for f in analyze-output.txt test-output.txt signing.txt; do
            if [ -f "$f" ]; then
              FILES+=("$f")
            fi
          done
          FILES+=("${APKS[@]}")

          if [ "${#APKS[@]}" -eq 0 ]; then
            STATE="BUILD FAILED - logs only, no APK in this release."
          else
            STATE="Most phones want app-arm64-v8a-release.apk."
          fi

          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            "${FILES[@]}" \
            --title "UP - latest build" \
            --notes "Commit ${{ github.sha }} - run ${{ github.run_number }}. $STATE"
