name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --org co.vibit.up --project-name up --platforms=android .
      - run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter analyze > analyze-output.txt 2>&1 || true
      - run: flutter test --reporter expanded > test-output.txt 2>&1 || true
      - run: flutter build apk --debug 2>&1 | tee build-debug.txt
      - run: flutter build apk --release 2>&1 | tee build-release.txt
      - name: Show how each APK is signed
        run: |
          ls -la build/app/outputs/flutter-apk/ > signing.txt 2>&1
          $ANDROID_HOME/build-tools/*/apksigner verify --print-certs build/app/outputs/flutter-apk/app-release.apk >> signing.txt 2>&1 || echo "release APK is NOT signed" >> signing.txt
          $ANDROID_HOME/build-tools/*/apksigner verify --print-certs build/app/outputs/flutter-apk/app-debug.apk >> signing.txt 2>&1 || echo "debug APK is NOT signed" >> signing.txt
      - name: Publish everything as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-debug.apk analyze-output.txt test-output.txt signing.txt --title "UP - latest build" --notes "Try app-debug.apk first."
