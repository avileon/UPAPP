<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#2a1230"/><stop offset="1" stop-color="#0d0a14"/>
    </radialGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6fa8"/><stop offset="0.55" stop-color="#ff3d8b"/><stop offset="1" stop-color="#d81b6a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="mglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- heart -->
  <path filter="url(#glow)" fill="url(#heart)"
    d="M256 408 C 226 382 108 300 108 210 C 108 160 146 124 192 124 C 222 124 244 140 256 162 C 268 140 290 124 320 124 C 366 124 404 160 404 210 C 404 300 286 382 256 408 Z"/>
  <!-- "here, now" ping: two arcs + dot, mint -->
  <g filter="url(#mglow)" fill="none" stroke="#3dffc5" stroke-linecap="round">
    <path d="M356 112 A 54 54 0 0 1 410 166" stroke-width="14"/>
    <path d="M356 76 A 90 90 0 0 1 446 166" stroke-width="12" opacity="0.6"/>
  </g>
  <circle cx="362" cy="160" r="20" fill="#3dffc5" filter="url(#mglow)"/>
</svg>
